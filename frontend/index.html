<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GeBIZ Monitor — Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<header>
  <h1>GeBIZ Monitor</h1>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/suppliers.html">Supplier Master</a>
    <a href="#" id="nav-notif">Notifications <span id="unread-badge" class="badge" style="display:none"></span></a>
    <a href="/settings.html">Notification Settings</a>
  </nav>
</header>

<main>
  <form class="filters" id="filters">
    <label>Agency
      <select name="agency"><option value="">All</option></select>
    </label>
    <label>Type
      <select name="type">
        <option value="">All</option>
        <option>Auction</option><option>Qualification</option><option>Quotation</option>
        <option>RequestForInformation</option><option>TenderLite</option><option>Tender</option>
      </select>
    </label>
    <label>Status
      <select name="status">
        <option value="">All</option>
        <option>Open</option><option>Closed</option><option>PendingAward</option>
        <option>Awarded</option><option>Cancelled</option><option>NoAward</option>
      </select>
    </label>
    <label>Published From <input type="date" name="date_from" /></label>
    <label>To <input type="date" name="date_to" /></label>
    <label>Keyword <input type="text" name="q" placeholder="description or doc no" /></label>
    <label style="flex-direction:row; align-items:center; gap:4px; padding-top:18px;">
      <input type="checkbox" name="watched_only" /> Watched only
    </label>
    <button type="submit">Search</button>
    <button type="button" class="secondary" id="btn-scrape">Trigger Scrape</button>
  </form>

  <div id="list-wrap"></div>

  <div class="pagination">
    <span id="total"></span>
    <button id="prev">Prev</button>
    <span id="page"></span>
    <button id="next">Next</button>
    <span class="jump-wrap" style="margin-left: 8px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #4b5563;">
      <span>| &nbsp; Go to</span>
      <input type="number" id="jump-page" min="1" style="width: 50px; padding: 5px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; text-align: center;" />
      <button id="btn-jump">Go</button>
    </span>
  </div>
</main>

<div id="notif-panel"></div>

<script type="module">
import { api, fmtDate, fmtDateOnly, daysUntil, statusPill, qs } from "/static/app.js";

const state = { page: 1, size: 20, total: 0 };
const $ = (s) => document.querySelector(s);

async function loadAgencies() {
  const agencies = await api("/opportunities/meta/agencies");
  const sel = $("select[name=agency]");
  agencies.forEach(a => { const o = document.createElement("option"); o.value = o.textContent = a; sel.appendChild(o); });
}

function readFilters() {
  const f = $("#filters");
  const fd = new FormData(f);
  const obj = {};
  fd.forEach((v, k) => { if (v) obj[k] = v; });
  obj.watched_only = f.watched_only.checked ? "true" : "";
  return obj;
}

async function load() {
  const filters = readFilters();
  const data = await api("/opportunities" + qs({ ...filters, page: state.page, size: state.size }));
  state.total = data.total;
  renderList(data.items);
  
  const totalPages = Math.max(1, Math.ceil(data.total / state.size));
  $("#total").textContent = `${data.total} result(s)`;
  $("#page").textContent = `page ${state.page} / ${totalPages}`;
  $("#prev").disabled = state.page <= 1;
  $("#next").disabled = state.page * state.size >= data.total;
  
  const jumpInput = $("#jump-page");
  if (jumpInput) {
    jumpInput.max = totalPages;
    jumpInput.value = state.page;
  }
}

function renderList(items) {
  if (!items.length) { $("#list-wrap").innerHTML = `<div class="empty">No opportunities match.</div>`; return; }
  const rows = items.map(o => {
    const d = daysUntil(o.closing_at);
    const closingSoon = d !== null && d >= 0 && d <= 3;
    
    let closingHtml = "—";
    if (o.closing_at) {
      const isPast = new Date(o.closing_at) < new Date();
      if (isPast) {
        closingHtml = `<div style="display:flex; flex-direction:column; gap:4px;">
          <span>${fmtDate(o.closing_at)}</span>
          <div><span class="closing-pill state-closed">Closed</span></div>
        </div>`;
      } else {
        closingHtml = `<div style="display:flex; flex-direction:column; gap:4px;">
          <span style="font-weight:500;">${fmtDate(o.closing_at)}</span>
          <div>
            <span class="closing-pill state-closing">Closing</span>
            ${d !== null && d >= 0 ? `<small style="color:#2563eb; font-weight:600; margin-left:4px;">(${d}d)</small>` : ""}
          </div>
        </div>`;
      }
    }

    return `<tr class="${closingSoon ? "row-closing" : ""}">
      <td><span class="star ${o.is_watched ? "active" : ""}" data-doc="${o.document_no}">${o.is_watched ? "★" : "☆"}</span></td>
      <td><a href="/detail.html?doc=${encodeURIComponent(o.document_no)}">${o.document_no}</a></td>
      <td style="font-family:monospace; font-size:12px;">${escapeHTML(o.reference_no || "—")}</td>
      <td>${o.opportunity_type || ""}</td>
      <td>${o.agency || ""}</td>
      <td><a href="/detail.html?doc=${encodeURIComponent(o.document_no)}">${escapeHTML(o.description || "")}</a></td>
      <td>${statusPill(o.status)}</td>
      <td>${fmtDateOnly(o.published_date)}</td>
      <td>${closingHtml}</td>
    </tr>`;
  }).join("");
  $("#list-wrap").innerHTML = `<table>
    <thead><tr><th></th><th>Doc No.</th><th>Ref No.</th><th>Type</th><th>Agency</th><th>Description</th><th>Status</th><th>Published</th><th>Closing</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
  $("#list-wrap").querySelectorAll(".star").forEach(el => {
    el.addEventListener("click", async (e) => {
      const doc = e.target.dataset.doc;
      const active = e.target.classList.contains("active");
      await api(`/opportunities/${encodeURIComponent(doc)}/watch`, { method: active ? "DELETE" : "POST" });
      e.target.classList.toggle("active");
      e.target.textContent = active ? "☆" : "★";
    });
  });
}

function escapeHTML(s) { return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c])); }

$("#filters").addEventListener("submit", (e) => { e.preventDefault(); state.page = 1; load(); });
$("#prev").addEventListener("click", () => { if (state.page > 1) { state.page--; load(); }});
$("#next").addEventListener("click", () => { state.page++; load(); });

function handleJump() {
  const jumpInput = $("#jump-page");
  const val = parseInt(jumpInput.value, 10);
  const totalPages = Math.max(1, Math.ceil(state.total / state.size));
  if (isNaN(val) || val < 1 || val > totalPages) {
    alert(`Please enter a valid page number between 1 and ${totalPages}.`);
    jumpInput.value = state.page;
    return;
  }
  state.page = val;
  load();
}
$("#btn-jump").addEventListener("click", handleJump);
$("#jump-page").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    handleJump();
  }
});

$("#btn-scrape").addEventListener("click", async () => { await api("/admin/scrape/trigger", { method: "POST" }); alert("Scrape started."); });

async function refreshUnread() {
  const ns = await api("/notifications?unread_only=true&limit=50");
  const badge = $("#unread-badge");
  if (ns.length) { badge.textContent = ns.length; badge.style.display = "inline"; }
  else { badge.style.display = "none"; }
}

let cachedNotifications = [];

function renderNotificationsInPanel() {
  const panel = $("#notif-panel");
  const alertsList = cachedNotifications.filter(n => n.type !== "System");
  
  const listHtml = alertsList.length ? alertsList.map(n => `
    <div class="item ${n.read_at ? "" : "unread"}" data-id="${n.id}">
      <div><strong>${escapeHTML(n.title)}</strong></div>
      <div style="margin-top:2px;">${escapeHTML(n.body || "")}</div>
      <div style="color:#888; font-size:11px; margin-top:4px;">${fmtDate(n.created_at)}</div>
      ${n.document_no ? `<div><a href="/detail.html?doc=${encodeURIComponent(n.document_no)}">→ ${n.document_no}</a></div>` : ""}
    </div>`).join("") : `<div class="empty">No new notifications.</div>`;
    
  panel.innerHTML = `
    <div style="padding:8px 12px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; background:#fafafa;">
      <strong style="font-size:13px; color:#374151;">商机动态 (${alertsList.filter(n => !n.read_at).length})</strong>
      <button id="mark-all" class="primary" style="font-size:11px; padding:3px 8px;">Mark all read</button>
    </div>
    <div style="max-height:360px; overflow-y:auto;">
      ${listHtml}
    </div>
  `;
  
  panel.querySelector("#mark-all")?.addEventListener("click", async () => {
    await api("/notifications/read-all", { method: "POST" });
    cachedNotifications.forEach(n => n.read_at = new Date().toISOString());
    renderNotificationsInPanel();
    refreshUnread();
  });
  
  panel.querySelectorAll(".item.unread").forEach(el => {
    el.addEventListener("click", async () => {
      await api(`/notifications/${el.dataset.id}/read`, { method: "PATCH" });
      const notif = cachedNotifications.find(n => n.id == el.dataset.id);
      if (notif) notif.read_at = new Date().toISOString();
      el.classList.remove("unread");
      renderNotificationsInPanel();
      refreshUnread();
    });
  });
}

$("#nav-notif").addEventListener("click", async (e) => {
  e.preventDefault();
  const panel = $("#notif-panel");
  if (panel.innerHTML) { panel.innerHTML = ""; return; }
  cachedNotifications = await api("/notifications?limit=50");
  panel.className = "notif-panel";
  renderNotificationsInPanel();
});

loadAgencies();
load();
refreshUnread();
setInterval(refreshUnread, 60_000);
</script>
</body>
</html>
