<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GeBIZ Monitor — Detail</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<header>
  <h1>GeBIZ Monitor</h1>
  <nav>
    <a href="/" id="back-to-dashboard">← Back to Dashboard</a>
    <a href="/suppliers.html">Supplier Master</a>
    <a href="/notifications.html">Notifications</a>
    <a href="/settings.html">Notification Settings</a>
  </nav>
</header>

<main>
  <div id="root" class="empty">Loading…</div>
</main>

<script type="module">
import { api, fmtDate, fmtDateOnly, statusPill, daysUntil } from "/static/app.js";

const params = new URLSearchParams(window.location.search);
const doc = params.get("doc");
params.delete("doc");
const backLink = document.getElementById("back-to-dashboard");
if (backLink) {
  backLink.href = "/" + (params.toString() ? "?" + params.toString() : "");
}
const $ = (s) => document.querySelector(s);
const escapeHTML = (s) => (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
const fmtCurrency = (val) => val === null || val === undefined ? "—" : new Intl.NumberFormat('en-SG', { style: 'currency', currency: 'SGD' }).format(val);

async function load() {
  if (!doc) { $("#root").textContent = "No document_no in URL."; return; }
  const o = await api(`/opportunities/${encodeURIComponent(doc)}`);
  $("#root").className = "";
  $("#root").innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h2 style="margin:0;">${escapeHTML(o.document_no)} — ${escapeHTML(o.description || "")}</h2>
      <div>
        <button id="toggle-watch" class="primary">${o.is_watched ? "★ Watching" : "☆ Watch"}</button>
        <button id="export" class="primary" style="background:#6b7280; margin-left:6px;">Export PDF</button>
      </div>
    </div>
    <div class="detail-wrap">
      <div class="card">
        <h2>Official Data</h2>
        <dl class="kv">
          <dt>Document No.</dt><dd>${escapeHTML(o.document_no)}</dd>
          <dt>Reference No.</dt><dd style="font-family:monospace; font-size:13px; font-weight:bold;">${escapeHTML(o.reference_no || "—")}</dd>
          <dt>Type</dt><dd>${escapeHTML(o.opportunity_type || "—")}</dd>
          <dt>Agency</dt><dd>${escapeHTML(o.agency || "—")}</dd>
          <dt>Category</dt><dd>${escapeHTML(o.procurement_category || "—")}</dd>
          <dt>Status</dt><dd>${statusPill(o.status)}</dd>
          <dt>Published</dt><dd>${fmtDateOnly(o.published_date)}</dd>
          <dt>Closing</dt>
          <dd>
            ${o.closing_at ? (() => {
              const d = daysUntil(o.closing_at);
              const isPast = new Date(o.closing_at) < new Date();
              if (isPast) {
                return `${fmtDate(o.closing_at)} <span class="closing-pill state-closed" style="margin-left:8px;">Closed</span>`;
              } else {
                return `${fmtDate(o.closing_at)} <span class="closing-pill state-closing" style="margin-left:8px;">Closing</span>${d !== null && d >= 0 ? ` <span style="font-size:12px; color:#2563eb; font-weight:600; margin-left:4px;">(${d}d left)</span>` : ""}`;
              }
            })() : "—"}
          </dd>
          <dt>Contact</dt><dd>${escapeHTML(o.contact_person || "—")}</dd>
          <dt>Source</dt><dd>${o.source_url ? `<a href="${o.source_url}" target="_blank" rel="noopener">GeBIZ</a>` : "—"}</dd>
          ${o.award_details ? `<dt>Award</dt><dd><pre style="margin:0;font-size:12px;background:#f3f4f6;padding:8px;border-radius:4px;">${escapeHTML(JSON.stringify(o.award_details, null, 2))}</pre></dd>` : ""}
        </dl>

        ${o.respondents && o.respondents.length ? `
          <h2 style="margin-top:28px; font-size:15px; border-bottom:1px solid #eee; padding-bottom:6px;">Respondents & Bid Offers (${o.respondents.length})</h2>
          <table style="width:100%; border-collapse:collapse; margin-top:8px; font-size:13px;">
            <thead>
              <tr style="background:#f9fafb;">
                <th style="padding:6px 10px; font-size:11px;">Supplier Name</th>
                <th style="padding:6px 10px; font-size:11px;">Bid Price</th>
                <th style="padding:6px 10px; font-size:11px;">Result</th>
              </tr>
            </thead>
            <tbody>
              ${o.respondents.map(r => `
                <tr class="${r.is_awarded ? "bid-awarded" : ""}" style="background:${r.is_awarded ? '#ecfdf5' : 'transparent'}">
                  <td style="padding:8px 10px; font-weight:600; color:#111827;"><a href="/suppliers.html" style="text-decoration:none; color:inherit;">${escapeHTML(r.supplier_name)}</a></td>
                  <td style="padding:8px 10px; font-family:monospace; font-weight:bold;">${fmtCurrency(r.amount)}</td>
                  <td style="padding:8px 10px; font-weight:bold; color:${r.is_awarded ? '#059669' : '#6b7280'}">
                    ${r.is_awarded ? '🏆 Awarded' : 'Submitted'}
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        ` : (o.status !== 'Open' ? '<h2 style="margin-top:28px; font-size:15px;">Respondents & Bid Offers</h2><p style="color:#9ca3af; font-size:13px; font-style:italic;">No respondents list recorded for this opportunity.</p>' : '')}

        <h2 style="margin-top:28px; font-size:15px; border-bottom:1px solid #eee; padding-bottom:6px;">Status Timeline</h2>
        <ul class="timeline">
          ${(o.status_updates || []).map(s => `<li>${fmtDate(s.changed_at)} — <strong>${s.from_status || "∅"}</strong> → <strong>${s.to_status}</strong></li>`).join("") || `<li><i>No status changes recorded.</i></li>`}
        </ul>
      </div>
      <div class="card">
        <h2>Internal Notes</h2>
        <form id="note-form">
          <textarea name="content" placeholder="Add a note…"></textarea>
          <button class="primary" type="submit" style="margin-top:8px;">Add Note</button>
        </form>
        <ul class="timeline" id="notes">
          ${(o.notes || []).map(n => `<li><strong>${escapeHTML(n.author)}</strong> · ${fmtDate(n.created_at)}<br/>${escapeHTML(n.content)}</li>`).join("") || `<li><i>No notes yet.</i></li>`}
        </ul>
      </div>
    </div>`;

  $("#toggle-watch").addEventListener("click", async (e) => {
    const watching = e.target.textContent.includes("★");
    await api(`/opportunities/${encodeURIComponent(doc)}/watch`, { method: watching ? "DELETE" : "POST" });
    e.target.textContent = watching ? "☆ Watch" : "★ Watching";
  });

  $("#note-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const content = e.target.content.value.trim();
    if (!content) return;
    await api(`/opportunities/${encodeURIComponent(doc)}/notes`, { method: "POST", body: { content } });
    load();
  });

  $("#export").addEventListener("click", () => {
    // PRD mentions "Export PDF" but doesn't specify format — fall back to print dialog for now.
    window.print();
  });
}

load();
</script>
</body>
</html>
